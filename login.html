<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Saya Art</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0; }
    .login-card { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 300px; text-align: center; }
    .login-card h2 { margin-bottom: 20px; color: #333; }
    .input-group { margin-bottom: 15px; text-align: left; }
    .input-group label { display: block; font-size: 14px; margin-bottom: 5px; }
    .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .show-password { display: flex; align-items: center; gap: 7px; margin: -5px 0 15px; font-size: 13px; color: #444; cursor: pointer; }
    .show-password input { width: auto; margin: 0; cursor: pointer; }
    button { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
    button:hover { background-color: #0056b3; }
    #error-msg { color: red; margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Admin Login</h2>
    <form id="login-form">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="admin@example.com">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="******">
      </div>
      <label class="show-password" for="show-password">
        <input type="checkbox" id="show-password">
        Show Password
      </label>
      <button type="submit">Login</button>
    </form>
    <p id="error-msg"></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, getIdTokenResult, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    // Aapki exact Firebase Keys
    const firebaseConfig = {
      apiKey: "AIzaSyC6CxokC0KwAtP9EMilEQHMJQKWCgLWYJc",
      authDomain: "sayaart.firebaseapp.com",
      projectId: "sayaart",
      storageBucket: "sayaart.firebasestorage.app",
      messagingSenderId: "805892692460",
      appId: "1:805892692460:web:417ef9926bbc01d9f288c9",
      measurementId: "G-S3CKT4LP6T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');
    const passwordInput = document.getElementById('password');
    const showPassword = document.getElementById('show-password');
    const params = new URLSearchParams(location.search);

    showPassword.addEventListener('change', () => {
      passwordInput.type = showPassword.checked ? 'text' : 'password';
    });

    if (params.get('error') === 'unauthorized') errorMsg.innerText = 'Is account ko Admin permission nahi hai.';
    if (params.get('error') === 'verification') errorMsg.innerText = 'Admin permission verify nahi ho payi. Dobara login karein.';

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = passwordInput.value;

      try {
        const credential = await signInWithEmailAndPassword(auth, email, password);
        const token = await getIdTokenResult(credential.user, true);
        if (token.claims.admin !== true) {
          await signOut(auth);
          errorMsg.innerText = 'Access denied: is email ko Admin permission nahi di gayi hai.';
          return;
        }
        const requestedNext = params.get('next');
        const nextPage = requestedNext === 'admin.html' ? 'admin.html' : 'admin.html';
        window.location.replace(nextPage);
      } catch (error) {
        errorMsg.innerText = error.code === "auth/too-many-requests" ? "Bahut attempts hue. Thodi der baad try karein." : "Galat Email ya Password!";
      }
    });
  </script>
</body>
</html>
