<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Saya Art</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f7f6; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #333; color: #fff; padding: 15px 20px; border-radius: 8px; }
    .btn-logout { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card h2 { margin-top: 0; border-bottom: 2px solid #ddd; padding-bottom: 10px; color: #333; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .btn-primary { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    table, th, td { border: 1px solid #ddd; }
    th, td { padding: 10px; text-align: left; }
    th { background: #f2f2f2; }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="header">
    <h1>Saya Art Control Panel</h1>
    <button id="logout-btn" class="btn-logout">Logout</button>
  </div>

  <div class="container">
    <!-- Image Upload & Price Change -->
    <div class="card">
      <h2>Add Product & Update Price</h2>
      <form id="product-form">
        <div class="form-group">
          <label>Item Name</label>
          <input type="text" id="prod-name" placeholder="e.g. Custom Art" required>
        </div>
        <div class="form-group">
          <label>Price (₹)</label>
          <input type="number" id="prod-price" placeholder="e.g. 499" required>
        </div>
        <div class="form-group">
          <label>Product Image</label>
          <input type="file" id="prod-img" accept="image/*" required>
        </div>
        <button type="submit" class="btn-primary">Upload / Add Product</button>
      </form>
      <p id="upload-status" style="margin-top:10px; font-weight:bold;"></p>
    </div>

    <!-- Customer Orders -->
    <div class="card">
      <h2>Customer Orders</h2>
      <table>
        <thead>
          <tr>
            <th>Customer</th>
            <th>Item</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="orders-list">
          <tr><td colspan="4">Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC6CxokC0KwAtP9EMilEQHMJQKWCgLWYJc",
      authDomain: "sayaart.firebaseapp.com",
      projectId: "sayaart",
      storageBucket: "sayaart.firebasestorage.app",
      messagingSenderId: "805892692460",
      appId: "1:805892692460:web:417ef9926bbc01d9f288c9",
      measurementId: "G-S3CKT4LP6T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "login.html";
      else loadOrders();
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = "login.html");
    });

    const form = document.getElementById('product-form');
    const status = document.getElementById('upload-status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.style.color = "blue";
      status.innerText = "Uploading image & saving details...";

      const name = document.getElementById('prod-name').value;
      const price = document.getElementById('prod-price').value;
      const file = document.getElementById('prod-img').files[0];

      try {
        const storageRef = ref(storage, 'products/' + Date.now() + '_' + file.name);
        await uploadBytes(storageRef, file);
        const imageUrl = await getDownloadURL(storageRef);

        await addDoc(collection(db, "products"), {
          name: name,
          price: Number(price),
          imageUrl: imageUrl,
          createdAt: new Date()
        });

        status.style.color = "green";
        status.innerText = "Product Uploaded Successfully!";
        form.reset();
      } catch (err) {
        status.style.color = "red";
        status.innerText = "Error: " + err.message;
      }
    });

    async function loadOrders() {
      const ordersList = document.getElementById('orders-list');
      try {
        const querySnapshot = await getDocs(collection(db, "orders"));
        if(querySnapshot.empty) {
          ordersList.innerHTML = "<tr><td colspan='4'>No orders found.</td></tr>";
          return;
        }
        ordersList.innerHTML = "";
        querySnapshot.forEach((doc) => {
          const data = doc.data();
          ordersList.innerHTML += `
            <tr>
              <td>${data.customerName || 'N/A'}</td>
              <td>${data.itemName || 'N/A'}</td>
              <td>₹${data.amount || '0'}</td>
              <td>${data.status || 'Pending'}</td>
            </tr>
          `;
        });
      } catch (err) {
        ordersList.innerHTML = "<tr><td colspan='4'>No orders found.</td></tr>";
      }
    }
  </script>
</body>
</html>
