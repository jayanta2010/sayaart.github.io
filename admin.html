<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Saya Art</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f7f6; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #333; color: #fff; padding: 15px 20px; border-radius: 8px; }
    .btn-logout { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
    .container { margin-top: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .card h2 { margin-top: 0; border-bottom: 2px solid #ddd; padding-bottom: 10px; color: #333; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .btn-primary { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; }
    .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    table, th, td { border: 1px solid #ddd; }
    th, td { padding: 10px; text-align: left; vertical-align: top; }
    th { background: #f2f2f2; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Saya Art Control Panel</h1>
    <button id="logout-btn" class="btn-logout">Logout</button>
  </div>

  <div class="container">
    <!-- Add Product -->
    <div class="card">
      <h2>Add Product & Manage Catalog</h2>
      <form id="product-form" style="display: flex; gap: 10px; flex-wrap: wrap;">
        <input type="text" id="prod-name" placeholder="Item Name" required style="padding: 8px; flex: 1;">
        <input type="number" id="prod-price" placeholder="Price (₹)" required style="padding: 8px; width: 100px;">
        <input type="url" id="prod-img-url" placeholder="Image Link (URL)" required style="padding: 8px; flex: 1;">
        <button type="submit" class="btn-primary">Add Product</button>
      </form>
      
      <h3 style="margin-top: 20px;">Current Live Products</h3>
      <table>
        <thead>
          <tr><th>Product Name</th><th>Price</th><th>Action</th></tr>
        </thead>
        <tbody id="admin-product-list"></tbody>
      </table>
    </div>

    <!-- Customer Orders with Complete Info -->
    <div class="card">
      <h2>All Customer Orders (Full Details)</h2>
      <table>
        <thead>
          <tr>
            <th>Order & Payment ID</th>
            <th>Customer Details</th>
            <th>Delivery Address</th>
            <th>Item & Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="orders-list">
          <tr><td colspan="5">Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC6CxokC0KwAtP9EMilEQHMJQKWCgLWYJc",
      authDomain: "sayaart.firebaseapp.com",
      projectId: "sayaart",
      storageBucket: "sayaart.firebasestorage.app",
      messagingSenderId: "805892692460",
      appId: "1:805892692460:web:417ef9926bbc01d9f288c9"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "login.html";
      else {
        loadAdminProducts();
        loadOrders();
      }
    });

    document.getElementById('logout-btn').onclick = () => {
      signOut(auth).then(() => window.location.href = "login.html");
    };

    document.getElementById('product-form').onsubmit = async (e) => {
      e.preventDefault();
      await addDoc(collection(db, "products"), {
        name: document.getElementById('prod-name').value,
        price: Number(document.getElementById('prod-price').value),
        imageUrl: document.getElementById('prod-img-url').value,
        createdAt: new Date()
      });
      document.getElementById('product-form').reset();
      loadAdminProducts();
    };

    async function loadAdminProducts() {
      const list = document.getElementById('admin-product-list');
      const snap = await getDocs(collection(db, "products"));
      list.innerHTML = "";
      snap.forEach((d) => {
        const item = d.data();
        list.innerHTML += `<tr><td>${item.name}</td><td>₹${item.price}</td><td><button class="btn-delete" onclick="deleteProduct('${d.id}')">Delete</button></td></tr>`;
      });
    }

    window.deleteProduct = async function(id) {
      if (confirm("Delete product?")) {
        await deleteDoc(doc(db, "products", id));
        loadAdminProducts();
      }
    };

    async function loadOrders() {
      const list = document.getElementById('orders-list');
      const snap = await getDocs(collection(db, "orders"));
      if(snap.empty) {
        list.innerHTML = "<tr><td colspan='5'>No orders received yet.</td></tr>";
        return;
      }
      list.innerHTML = "";
      snap.forEach((d) => {
        const item = d.data();
        list.innerHTML += `
          <tr>
            <td><b>${item.orderId || d.id}</b><br><small>Pay ID: ${item.paymentId || 'N/A'}</small><br><small style="color:#888;">${item.createdAt || ''}</small></td>
            <td><b>${item.customerName || 'N/A'}</b><br>📞 ${item.customerPhone || 'N/A'}</td>
            <td>${item.deliveryAddress || 'N/A'}</td>
            <td>${item.itemName}<br><b>₹${item.amount}</b></td>
            <td><span style="color:${item.paymentStatus === 'PAID' ? 'green' : 'orange'}; font-weight:bold;">${item.paymentStatus || 'PENDING'}</span></td>
          </tr>
        `;
      });
    }
  </script>
</body>
</html>
