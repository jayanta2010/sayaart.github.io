<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Saya Art</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #f8fafc; padding: 20px; color: #1e293b; }
    .container { max-width: 900px; margin: auto; }
    .card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
    h2, h3 { margin-bottom: 15px; }
    input, textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #cbd5e1; border-radius: 6px; }
    button { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .btn-delete { background: #ef4444; margin-left: 8px; }
    .btn-delete:hover { background: #dc2626; }
    .item-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
  </style>
</head>
<body>

  <div class="container">
    <h2 style="display:flex; justify-content:space-between; align-items:center;">
      <span>Saya Art Admin Panel</span>
      <a href="index.html" style="font-size:14px; text-decoration:none; color:#2563eb;">← Go to Main Store</a>
    </h2>

    <!-- Add New Product -->
    <div class="card">
      <h3>Add New Store Product</h3>
      <form id="addProductForm">
        <input type="text" id="pName" placeholder="Product Name (e.g. Custom Visiting Card)" required>
        <input type="number" id="pPrice" placeholder="Price (₹)" required>
        <textarea id="pDesc" placeholder="Product Description..." rows="2" required></textarea>
        <input type="text" id="pImg" placeholder="Image Filename (e.g. saya-art-advertising-logo.jpg)" value="saya-art-advertising-logo.jpg">
        <button type="submit">Publish Product</button>
      </form>
    </div>

    <!-- Active Products List -->
    <div class="card">
      <h3>Active Products</h3>
      <div id="adminProductList">Loading products...</div>
    </div>

    <!-- Customer Orders -->
    <div class="card">
      <h3>All Customer Orders</h3>
      <div id="adminOrdersList">Loading orders...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC6CxokC0KwAtP9EMilEQHMJQKWCgLWYJc",
      authDomain: "sayaart.firebaseapp.com",
      projectId: "sayaart",
      storageBucket: "sayaart.firebasestorage.app",
      messagingSenderId: "805892692460",
      appId: "1:805892692460:web:417ef9926bbc01d9f288c9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Load Admin Data
    async function loadAdminData() {
      // Fetch Products
      const pContainer = document.getElementById('adminProductList');
      const pSnap = await getDocs(collection(db, "products"));
      if(pSnap.empty) {
        pContainer.innerHTML = "<p style='color:#777;'>No products in database.</p>";
      } else {
        pContainer.innerHTML = "";
        pSnap.forEach(d => {
          const item = d.data();
          pContainer.innerHTML += `
            <div class="item-row">
              <div>
                <b>${item.name}</b> - ₹${item.price}<br>
                <small style="color:#666;">${item.description}</small>
              </div>
              <button class="btn-delete" onclick="deleteProduct('${d.id}')">Delete</button>
            </div>
          `;
        });
      }

      // Fetch Orders
      const oContainer = document.getElementById('adminOrdersList');
      const oSnap = await getDocs(collection(db, "orders"));
      if(oSnap.empty) {
        oContainer.innerHTML = "<p style='color:#777;'>No orders placed yet.</p>";
      } else {
        oContainer.innerHTML = "";
        oSnap.forEach(d => {
          const o = d.data();
          oContainer.innerHTML += `
            <div class="item-row">
              <div>
                <b>Order ID: ${o.orderId || d.id}</b> | Customer: ${o.customerName} (${o.customerPhone})<br>
                Items: ${o.itemName} | <b>Total: ₹${o.amount}</b><br>
                <small style="color:#555;">Delivery Address: ${o.deliveryAddress}</small>
              </div>
            </div>
          `;
        });
      }
    }

    // Add Product Form Submit
    document.getElementById('addProductForm').onsubmit = async (e) => {
      e.preventDefault();
      await addDoc(collection(db, "products"), {
        name: document.getElementById('pName').value,
        price: Number(document.getElementById('pPrice').value),
        description: document.getElementById('pDesc').value,
        imageUrl: document.getElementById('pImg').value || "saya-art-advertising-logo.jpg"
      });
      alert("Product added successfully!");
      location.reload();
    };

    window.deleteProduct = async function(id) {
      if(confirm("Are you sure you want to delete this product?")) {
        await deleteDoc(doc(db, "products", id));
        loadAdminData();
      }
    };

    loadAdminData();
  </script>
</body>
</html>
