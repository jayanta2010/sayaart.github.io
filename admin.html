<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Saya Art</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f7f6; }
    .header { display: flex; justify-content: space-between; align-items: center; background: #333; color: #fff; padding: 15px 20px; border-radius: 8px; }
    .btn-logout { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
    .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .card h2 { margin-top: 0; border-bottom: 2px solid #ddd; padding-bottom: 10px; color: #333; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
    .form-group input { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    .btn-primary { background: #27ae60; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    table, th, td { border: 1px solid #ddd; }
    th, td { padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

  <div class="header">
    <h1>Saya Art Control Panel</h1>
    <button id="logout-btn" class="btn-logout">Logout</button>
  </div>

  <div class="container">
    <!-- Add Product Form & Manage Products -->
    <div class="card">
      <h2>Add Product & Update Price</h2>
      <form id="product-form">
        <div class="form-group">
          <label>Item Name</label>
          <input type="text" id="prod-name" placeholder="e.g. Logo Design" required>
        </div>
        <div class="form-group">
          <label>Price (₹)</label>
          <input type="number" id="prod-price" placeholder="e.g. 110" required>
        </div>
        <div class="form-group">
          <label>Image URL (Link)</label>
          <input type="url" id="prod-img-url" placeholder="https://example.com/image.jpg" required>
        </div>
        <button type="submit" class="btn-primary">Upload / Add Product</button>
      </form>
      <p id="upload-status" style="margin-top:10px; font-weight:bold;"></p>

      <h3 style="margin-top: 30px;">Manage Existing Products</h3>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Price</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="admin-product-list">
          <tr><td colspan="3">Loading...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Customer Orders List -->
    <div class="card">
      <h2>Customer Orders</h2>
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Item</th>
            <th>Amount</th>
            <th>Payment Status</th>
          </tr>
        </thead>
        <tbody id="orders-list">
          <tr><td colspan="5">Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC6CxokC0KwAtP9EMilEQHMJQKWCgLWYJc",
      authDomain: "sayaart.firebaseapp.com",
      projectId: "sayaart",
      storageBucket: "sayaart.firebasestorage.app",
      messagingSenderId: "805892692460",
      appId: "1:805892692460:web:417ef9926bbc01d9f288c9",
      measurementId: "G-S3CKT4LP6T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, (user) => {
      if (!user) window.location.href = "login.html";
      else {
        loadAdminProducts();
        loadOrders();
      }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
      signOut(auth).then(() => window.location.href = "login.html");
    });

    // Add Product
    const form = document.getElementById('product-form');
    const status = document.getElementById('upload-status');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      status.style.color = "blue";
      status.innerText = "Saving details...";

      try {
        await addDoc(collection(db, "products"), {
          name: document.getElementById('prod-name').value,
          price: Number(document.getElementById('prod-price').value),
          imageUrl: document.getElementById('prod-img-url').value,
          createdAt: new Date()
        });
        status.style.color = "green";
        status.innerText = "Product Added Successfully!";
        form.reset();
        loadAdminProducts();
      } catch (err) {
        status.style.color = "red";
        status.innerText = "Error: " + err.message;
      }
    });

    // Load & Delete Products
    async function loadAdminProducts() {
      const list = document.getElementById('admin-product-list');
      const querySnapshot = await getDocs(collection(db, "products"));
      list.innerHTML = "";
      querySnapshot.forEach((d) => {
        const item = d.data();
        list.innerHTML += `
          <tr>
            <td>${item.name}</td>
            <td>₹${item.price}</td>
            <td><button class="btn-delete" onclick="deleteProduct('${d.id}')">Delete</button></td>
          </tr>
        `;
      });
    }

    window.deleteProduct = async function(id) {
      if (confirm("Are you sure you want to delete this product?")) {
        await deleteDoc(doc(db, "products", id));
        loadAdminProducts();
      }
    };

    // Load Orders with Razorpay Order ID & Payment Status
    async function loadOrders() {
      const ordersList = document.getElementById('orders-list');
      try {
        const querySnapshot = await getDocs(collection(db, "orders"));
        if(querySnapshot.empty) {
          ordersList.innerHTML = "<tr><td colspan='5'>No orders found.</td></tr>";
          return;
        }
        ordersList.innerHTML = "";
        querySnapshot.forEach((d) => {
          const data = d.data();
          ordersList.innerHTML += `
            <tr>
              <td><small>${data.orderId || d.id.substring(0,8)}</small></td>
              <td>${data.customerName || 'N/A'}<br><small>${data.customerPhone || ''}</small></td>
              <td>${data.itemName || 'N/A'}</td>
              <td><b>₹${data.amount || '0'}</b></td>
              <td><span style="color:${data.paymentStatus === 'PAID' ? 'green' : 'orange'}; font-weight:bold;">${data.paymentStatus || 'Pending'}</span></td>
            </tr>
          `;
        });
      } catch (err) {
        ordersList.innerHTML = "<tr><td colspan='5'>Error loading orders.</td></tr>";
      }
    }
  </script>
</body>
</html>
