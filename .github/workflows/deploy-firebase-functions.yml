name: Deploy Firebase Functions

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/805892692460/locations/global/workloadIdentityPools/github-deploy/providers/github-provider
          service_account: firebase-adminsdk-fbsvc@sayaart.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Firebase Function
        run: firebase deploy --only functions:privateDesignApi --project sayaart
