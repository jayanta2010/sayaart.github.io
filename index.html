<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saya Art — Custom Printing</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    /* Left Profile Sidebar CSS */
    .profile-sidebar {
      position: fixed; top: 0; left: -320px; width: 300px; height: 100%;
      background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.2);
      transition: left 0.3s ease; z-index: 9999; padding: 20px; box-sizing: border-box;
    }
    .profile-sidebar.active { left: 0; }
    .sidebar-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; z-index: 9998;
    }
    .sidebar-overlay.active { display: block; }
    .close-sidebar { float: right; font-size: 24px; cursor: pointer; border: none; background: none; }
    .profile-card { margin-top: 30px; text-align: center; }
    .user-avatar { width: 70px; height: 70px; border-radius: 50%; background: #27ae60; color: white; display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 10px; }
  </style>
</head>
<body>

  <!-- Left Profile Sidebar -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="profile-sidebar" id="profileSidebar">
    <button class="close-sidebar" id="closeProfileBtn">&times;</button>
    <div class="profile-card">
      <div class="user-avatar" id="avatarText">👤</div>
      <h3 id="profileName">Guest User</h3>
      <p id="profilePhone" style="color: #666; font-size: 14px;">Not Logged In</p>
    </div>
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    <div>
      <h4>Account Options</h4>
      <p style="font-size: 13px; color: #555;">Verified via Mobile OTP</p>
      <button id="logoutUserBtn" style="display:none; background:#e74c3c; color:white; border:none; padding:8px 12px; border-radius:4px; width:100%; cursor:pointer; margin-top:20px;">Logout</button>
    </div>
  </aside>

  <header>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button id="openProfileBtn" style="background: none; border: 1px solid #ddd; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold;">☰ Profile</button>
      <a class="brand" href="#home"><img class="brand-logo" src="saya-art-advertising-logo.jpg" alt="Saya Art" /><span><b data-shop-name>Saya Art & Advertising</b></span></a>
    </div>
  </header>
  
  <main id="home" style="padding: 20px;">
    <section class="products-section" id="products">
      <h2>Products Catalog</h2>
      <div class="product-grid" id="productGrid" style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px;"></div>
    </section>
  </main>

  <!-- Checkout & OTP Modal -->
  <div class="modal" id="checkoutModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:10000;">
    <div style="background:white; padding:25px; border-radius:8px; width:90%; max-width:400px; position:relative;">
      <button class="modal-close" style="position:absolute; top:10px; right:15px; border:none; background:none; font-size:20px; cursor:pointer;">×</button>
      <h3>Customer Order Details</h3>
      <form id="checkoutForm">
        <div style="margin-bottom:10px;">
          <label>Full Name</label>
          <input id="custName" required placeholder="Enter full name" style="width:100%; padding:8px; box-sizing:border-box;">
        </div>
        <div style="margin-bottom:10px;">
          <label>Full Delivery Address</label>
          <textarea id="custAddress" required placeholder="Flat, Building, Street, City, PIN" style="width:100%; padding:8px; box-sizing:border-box; height:60px;"></textarea>
        </div>
        
        <div id="phone-step" style="margin-bottom:10px;">
          <label>Mobile Number (+91)</label>
          <input id="custPhone" value="+91" required pattern="^\+91[0-9]{10}$" style="width:100%; padding:8px; box-sizing:border-box;">
          <div id="recaptcha-container" style="margin-top:10px;"></div>
          <button type="button" id="sendOtpBtn" style="width:100%; padding:10px; background:#333; color:white; border:none; margin-top:10px; cursor:pointer;">Send OTP</button>
        </div>

        <div id="otp-step" style="display:none; margin-bottom:10px;">
          <label>Enter 6-Digit OTP</label>
          <input id="otpInput" type="number" placeholder="123456" style="width:100%; padding:8px; box-sizing:border-box;">
          <button type="button" id="verifyPayBtn" style="width:100%; padding:10px; background:#27ae60; color:white; border:none; margin-top:10px; cursor:pointer; font-weight:bold;">Verify OTP & Pay via Razorpay</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
